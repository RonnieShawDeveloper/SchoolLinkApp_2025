@if (!isLoginPage) {
  <header class="sticky top-0 z-50 bg-gray-800 text-white shadow-md">
    <nav class="container mx-auto px-6 py-3 flex justify-between items-center">
      <div class="flex items-center">
        <img src="/icons/icon-128x128.png" alt="SchoolLink Logo" class="h-10 w-10 mr-3">
        <a class="text-xl font-bold" href="#">SchoolLink</a>
      </div>
      <div>
        <button (click)="logout()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
          Logout
        </button>
      </div>
    </nav>
  </header>
}

<main class="container mx-auto p-4">
  @if (!showInstallScreen()) {
    <router-outlet></router-outlet>
  } @else {
    <app-install></app-install>
  }
</main>

@if (!isLoginPage) {
  <footer class="sticky bottom-0 z-50 bg-gray-200 text-center text-xs p-3 w-full">
    &copy; 2025 SchoolLink App. All Rights Reserved.
  </footer>
}
