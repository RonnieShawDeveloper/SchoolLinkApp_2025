<div class="p-4 relative">


  <div class="scanner-container">
    <zxing-scanner [enable]="scannerEnabled" (scanSuccess)="scanSuccess($event)"></zxing-scanner>
    <div class="scanner-overlay">
      <div class="scanner-box"></div>
    </div>
  </div>

  <p class="text-center text-lg font-semibold mt-4">
    Please align the QR Code on the student ID in the camera window to scan.
  </p>

  <div class="mt-4 flex gap-3 justify-center">
    <button (click)="goToManualEntry()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-semibold py-2 px-4 rounded-lg shadow">
      Manual Entry
    </button>
    <button (click)="exitToDashboard()" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg shadow">
      Exit
    </button>
  </div>
</div>
