<div class="flex flex-col items-center p-6">
  <img src="/images/logo_main.jpg" alt="Ministry of Education Logo" class="mt-[10px] mb-[20px] mx-auto">

  <div class="w-full max-w-5xl">
    <h1 class="text-3xl font-extrabold tracking-tight mb-2 text-center">Dashboard</h1>
    <p class="text-center mb-8 opacity-90">Choose an action to get started</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <!-- Scanner -->
      <button aria-label="Open Scanner" (click)="goToScanner()"
              class="action-card scan anim-enter delay-1">
        <div class="icon">📠</div>
        <div class="label">Scanner</div>
        <div class="sub">Scan QR to verify and record attendance</div>
      </button>

      <!-- Photos -->
      <button aria-label="Manage Student Photos" (click)="goToPhotos()"
              class="action-card photos anim-enter delay-2">
        <div class="icon">📷</div>
        <div class="label">Photos</div>
        <div class="sub">Capture or update student photos</div>
      </button>

      <!-- Live Reports -->
      <button aria-label="Open Live Reports" (click)="goToLiveReports()"
              class="action-card reports anim-enter delay-3">
        <div class="icon">📊</div>
        <div class="label">Live Reports</div>
        <div class="sub">View real-time attendance insights</div>
      </button>

      <!-- Manual Entry -->
      <button aria-label="Manual Attendance Entry" (click)="goToManualEntry()"
              class="action-card manual anim-enter delay-4">
        <div class="icon">📝</div>
        <div class="label">Manual Entry</div>
        <div class="sub">Search students and mark attendance</div>
      </button>
    </div>
  </div>
</div>
