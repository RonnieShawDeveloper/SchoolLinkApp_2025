<div class="bg-white min-h-screen">


  <main class="flex flex-col items-center justify-center p-4">
    <img src="/images/logo_main.jpg" alt="Ministry of Education Logo" class="my-5">

    <div class="bg-gray-300 rounded-lg shadow-lg p-8 w-full max-w-sm border border-gray-400">
      <p class="text-center font-bold text-gray-600 mb-6">
        <br><span class="font-bold text-2xl">MINISTRY OF EDUCATION</span><br><span class="text-red-800">AUTHORIZED ACCESS ONLY</span><br>Please login using your MOE Credentials.
      </p>

      <form (ngSubmit)="login()" #loginForm="ngForm">
        <div class="mb-4">
          <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
          <input type="text" id="username" name="username" [(ngModel)]="username" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-white" required>
        </div>

        <div class="mb-6">
          <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline bg-white" required>
        </div>

        <div class="flex items-center justify-between">
          <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline disabled:bg-gray-400 disabled:cursor-not-allowed" type="submit" [disabled]="!loginForm.form.valid">
            Sign In
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
